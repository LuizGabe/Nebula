services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcriber}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:latest
    container_name: dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY}}
      MINIO_NOTIFY_WEBHOOK_ENABLE_API: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_API: "http://host.docker.internal:3333/internal/minio-webhook"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_API: "${MINIO_WEBHOOK_SECRET}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: dev-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - GRPC_WORKER_HOST=${GRPC_WORKER_HOST:-host.docker.internal:50051}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - PROMPTS_DIR=/app/packages/prompts
    command: ["pnpm", "run", "dev"]
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "3333:3333"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./packages/prompts:/app/packages/prompts:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: dev-web
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3333
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: ["pnpm", "run", "dev", "--host"]
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ./apps/web/tailwind.config.js:/app/apps/web/tailwind.config.js:ro
      - ./apps/web/postcss.config.js:/app/apps/web/postcss.config.js:ro

  groq_worker:
    build:
      context: apps/groq_worker/
      dockerfile: Dockerfile
      target: dev
    image: groq-worker:latest
    container_name: groq-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
    entrypoint: ["watchfiles"]
    command: ["python -m worker", "."]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "9092:9091"
    volumes:
      - ./apps/groq_worker/audio:/app/audio
      - ./apps/groq_worker/batch:/app/batch
      - ./apps/groq_worker/core:/app/core
      - ./apps/groq_worker/emit:/app/emit
      - ./apps/groq_worker/events:/app/events
      - ./apps/groq_worker/inference:/app/inference
      - ./apps/groq_worker/infra:/app/infra
      - ./apps/groq_worker/observability:/app/observability
      - ./apps/groq_worker/worker.py:/app/worker.py

volumes:
  postgres-data:
  redis-data:
  minio-data:
