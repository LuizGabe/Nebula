services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # TCP
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:latest
    container_name: dev-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_NOTIFY_WEBHOOK_ENABLE_API: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_API: "http://host.docker.internal:3333/internal/minio-webhook"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_API: "${MINIO_WEBHOOK_SECRET}"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Web Page
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dev-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "3333:3333"
    volumes:
      - ./packages/prompts:/app/packages/prompts:ro

  parakeet:
    build:
      context: .
      dockerfile: apps/parakeet_worker/Dockerfile
    container_name: parakeet-v3
    # network_mode: host # Use se for rodar a worker remotamente
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MODELS_DIR=/models
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./apps/parakeet_worker/models:/models:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
