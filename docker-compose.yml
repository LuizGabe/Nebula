services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379" # TCP
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcriber}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:latest
    container_name: dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY}}
      MINIO_NOTIFY_WEBHOOK_ENABLE_API: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_API: "http://host.docker.internal:3333/internal/minio-webhook"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_API: "${MINIO_WEBHOOK_SECRET}"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Web Page Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: dev-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - GRPC_WORKER_HOST=${GRPC_WORKER_HOST:-host.docker.internal:50051}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "3333:3333"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: http://localhost:3333
    container_name: dev-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  groq_worker:
    build:
      context: apps/groq_worker/
      dockerfile: Dockerfile
      target: production
    image: groq-worker:latest
    container_name: groq-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "9092:9091"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  parakeet:
    profiles:
      - parakeet
    build:
      context: apps/parakeet_worker/
      dockerfile: Dockerfile
    image: parakeet-worker:latest
    network_mode: host
    tmpfs:
      - /tmp:exec,mode=1777
    restart: unless-stopped
    env_file:
      - .env
      - apps/parakeet_worker/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-transcriber}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "50051:50051"   # gRPC
      - "9091:9090"     # Prometheus metrics
    volumes:
      # Mantém o cache dos modelos de IA salvo no seu SSD (fora do container)
      - model-cache:/app/.cache
      
      # ── VOLUMES DE DESENVOLVIMENTO (Sincronização instantânea) ──────────────
      # Mapeia os seus arquivos locais direto para dentro do container
      - ./apps/parakeet_worker/core:/app/core
      - ./apps/parakeet_worker/grpc_server:/app/grpc_server
      - ./apps/parakeet_worker/session:/app/session
      - ./apps/parakeet_worker/inference:/app/inference
      - ./apps/parakeet_worker/batch:/app/batch
      - ./apps/parakeet_worker/emit:/app/emit
      - ./apps/parakeet_worker/observability:/app/observability
      - ./apps/parakeet_worker/infra:/app/infra
      - ./apps/parakeet_worker/utils:/app/utils
      - ./apps/parakeet_worker/worker.py:/app/worker.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 5s
      start_period: 90s   
      retries: 3
    # Nota: Se você configurou o limite de 50m globalmente no Daemon (Opção 1 anterior),
    # você pode remover essas linhas de logging abaixo se quiser deixar o arquivo mais limpo.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  model-cache:
    external: true
