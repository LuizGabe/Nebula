<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" style="color-scheme:dark;background:#111214">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/nebula-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula</title>
    <script>
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('nebula:theme') === 'light') theme = 'light'; } catch {}
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.background = theme === 'light' ? '#f6f7f9' : '#111214';
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
