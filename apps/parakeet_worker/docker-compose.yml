version: "3.9"

# ── Parakeet Worker Stack ─────────────────────────────────────────────────────
#
# Serviços:
#   worker      — Parakeet gRPC Worker (GPU)
#   postgres    — PostgreSQL para persistência de transcrições batch
#   redis       — Redis para BullMQ
#   minio       — MinIO para armazenamento de uploads
#   prometheus  — Scraping de métricas
#   grafana     — Dashboards
#   otel        — OpenTelemetry Collector → Tempo (tracing)
#
# Pré-requisitos:
#   - NVIDIA Container Toolkit instalado
#   - Arquivo .env preenchido (copiar de .env.example)
#
# Uso:
#   docker compose up -d
#   docker compose logs -f worker

services:

  # ── worker ──────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: parakeet-worker:latest
    container_name: parakeet-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "50051:50051"   # gRPC
      - "9090:9090"     # Prometheus metrics
    volumes:
      # Cache do modelo (evita re-download a cada restart)
      - model-cache:/app/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - transcriber
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 5s
      start_period: 90s   # modelo leva tempo para carregar
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── postgres ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: transcriber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-transcriber}
      POSTGRES_USER:     ${POSTGRES_USER:-transcriber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcriber}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - transcriber
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcriber}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transcriber-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - transcriber
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── minio ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: transcriber-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    networks:
      - transcriber
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: transcriber-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - transcriber
    depends_on:
      - worker

  # ── grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: transcriber-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - transcriber
    depends_on:
      - prometheus

  # ── otel collector ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: transcriber-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infra/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - transcriber

# ── volumes ───────────────────────────────────────────────────────────────────
volumes:
  model-cache:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:

# ── redes ─────────────────────────────────────────────────────────────────────
networks:
  transcriber:
    driver: bridge
